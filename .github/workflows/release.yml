# Shared-builder integration follows keremimo/melodee commit 4f5fb6d.
name: Build and attest firmware

on:
  push:
    tags: ['v[0-9]*']
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gruselcore-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Prepare a draft without replacing a public release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then exit 0; fi
          version=${GITHUB_REF_NAME#v}
          # Match the version syntax accepted by tools/build.py.
          [[ "$version" =~ ^[0-9]{1,2}\.[0-9]{1,2}(\.[0-9]{1,2})?(-[A-Za-z0-9]+)?$ ]]
          flags=(--prerelease=false)
          if [[ "$version" == *-* ]]; then flags=(--prerelease --latest=false); fi
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft); then
            [[ "$draft" == true ]] || { echo 'Refusing to rebuild a public release'; exit 1; }
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "GruselCore $version" --generate-notes "${flags[@]}"
          fi

  firmware:
    needs: prepare
    # The Firmware Hub recognises attestations from this reviewed builder tag.
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      sdk: true
      tests-block: true
      build: |
        set -euo pipefail
        export X0X_JOBS=2
        # the fonts' tabular figures (tools/gen_font.py, OpenType tnum): Pillow's raqm, which loads the system's FriBiDi
        sudo apt-get install -y -qq libfribidi0
        python3 -c "from PIL import features; assert features.check('raqm'), 'Pillow without raqm'"
        test "$(git -C "$AC79_SDK" rev-parse HEAD)" = d179b4484759423312073f5fbb232501aa491047
        mkdir -p build/release-assets
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          version=${GITHUB_REF_NAME#v}
          ./build.sh --release "$version"
          cp "build/gruselcore-$version.fwsc" build/x0x.fwsc
          cp "build/gruselcore-$version.fwsc" build/release-assets/
          cp build/x0x.bin "build/release-assets/gruselcore-$version-app.bin"
        else
          ./build.sh
          cp build/x0x.fwsc "build/release-assets/gruselcore-dev-${GITHUB_RUN_NUMBER}.fwsc"
          cp build/x0x.bin "build/release-assets/gruselcore-dev-${GITHUB_RUN_NUMBER}-app.bin"
        fi
      test: |
        set -euo pipefail
        # The engine comparison tests need the original sources. Pin them so a
        # later upstream change cannot silently change a release's test inputs.
        # fetch_ref DIR COMMIT REPO...: the commit pins the content; it comes from the first repository
        # that still serves it.
        fetch_ref() {
          local name="$1" dir="build/refs/$1" sha="$2" repo
          shift 2
          git init -q "$dir"
          for repo in "$@"; do
            if GIT_TERMINAL_PROMPT=0 git -C "$dir" fetch -q --depth 1 "https://github.com/$repo.git" "$sha"; then
              git -C "$dir" checkout -q --detach FETCH_HEAD
              test "$(git -C "$dir" rev-parse HEAD)" = "$sha"
              echo "$name: $sha from $repo"
              return 0
            fi
          done
          echo "$name: $sha not found in: $*"
          return 1
        }
        # the 303's reference (Open303 as X0X compares it); pinned, so an upstream change cannot alter a test
        fetch_ref schwung-303 7680578cdecd91e512cfddb9c9eb07b287fb64f4 charlesvestal/schwung-303
        export SCHWUNG303="$PWD/build/refs/schwung-303"
        sh tests/run_tests.sh
      packages: build/release-assets/*

  verify:
    needs: firmware
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: build/attested
      - name: Verify checksums and signed source provenance
        working-directory: build/attested
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          for package in build/release-assets/*.fwsc build/release-assets/*-app.bin; do
            gh attestation verify "$package" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow zvenson/fm1-build/.github/workflows/build.yml \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA"
          done
      - name: Publish the verified draft
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
